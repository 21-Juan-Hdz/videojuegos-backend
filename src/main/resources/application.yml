# =====================================================================
# Toda la configuración sensible / de entorno se toma de VARIABLES DE ENTORNO.
#   SERVER_PORT   -> puerto HTTP (default 3000, el que espera el Nginx del front)
#   DB_HOST       -> endpoint de RDS o IP privada de la instancia MySQL
#   DB_PORT       -> default 3306
#   DB_NAME       -> default videojuegos_db (el que crea db_script.sql)
#   DB_USER       -> usuario de la BD
#   DB_PASSWORD   -> contraseña de la BD
#   DB_SSL_MODE   -> PREFERRED (default) | REQUIRED | DISABLED
#   APP_JWT_SECRET-> secreto para firmar los JWT
# =====================================================================
server:
  port: ${SERVER_PORT:3000}
  address: 0.0.0.0

app:
  jwt:
    secret: "${APP_JWT_SECRET:4a0efa73ee27ab4b2ecaa6955ea9c0d33a72281eb78c4addc6a83238e53c6114}"
    expiration-minutes: 120

spring:
  main:
    lazy-initialization: true
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:videojuegos_db}?sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 5
      connection-timeout: 2000
      validation-timeout: 2000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        hbm2ddl:
          auto: none
        boot:
          allow_jdbc_metadata_access: false

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

springdoc:
  swagger-ui:
    path: /docs/
    enabled: true
    doc-expansion: none
    tags-sorter: alpha
  api-docs:
    path: /docs/api-docs
    enabled: true
    
  

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # /actuator/health/liveness (para health checks de ALB/ASG)
