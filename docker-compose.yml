# Backend Videojuegos conectado a Amazon RDS (MySQL).
#
#   docker compose up --build -d
#
# Verificación:
#   http://localhost:3000/api/health/db   -> "status": "UP"
#   http://localhost:3000/api/producto
#
# El front (Nginx) espera el back en 10.0.3.50:3000, por eso se publica el puerto 3000.
services:
  api:
    build: .
    image: videojuegos-backend:latest
    container_name: videojuegos-api
    restart: always
    environment:
      SERVER_PORT: "3000"

      # ===== Conexión a la base de datos (RDS) =====
      DB_HOST: actividad1-tarea-4.cjy8so4ailak.us-east-1.rds.amazonaws.com
      DB_PORT: "3306"
      DB_NAME: actividad_1_aws
      DB_USER: admin
      DB_PASSWORD: "500faysofsummer"
      DB_SSL_MODE: PREFERRED
      # =============================================

      APP_JWT_SECRET: 4a0efa73ee27ab4b2ecaa6955ea9c0d33a72281eb78c4addc6a83238e53c6114
      JAVA_OPTS: -Xms128m -Xmx512m -Duser.timezone=UTC
    ports:
      - "3000:3000"
